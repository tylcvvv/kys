<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TransferFrom</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #05060a; --card: rgba(255,255,255,0.045); --border: rgba(120,140,255,0.14);
    --text: #eef1ff; --muted: #8891b5; --green: #3ce6a8; --red: #ff6b81;
    --tw: #3375bb; --tw2: #1a4d8f; --accent: #6c8cff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(51,117,187,0.20) 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(108,140,255,0.16) 0%, transparent 60%),
      var(--bg);
    color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden;
  }
  .card {
    position: relative; z-index: 1; width: 100%; max-width: 520px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015));
    border: 1px solid var(--border); border-radius: 24px; padding: 34px 28px;
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 30px 80px -40px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  h1 {
    font-size: 20px; font-weight: 800; letter-spacing: -0.03em; text-align: center; margin-bottom: 18px;
    background: linear-gradient(180deg, #ffffff, #b9c4f0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%; font: inherit; font-size: 13px;
    font-family: ui-monospace, "SF Mono", monospace;
    color: var(--text); background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
    padding: 11px 12px; outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus, .field select:focus {
    border-color: rgba(108,140,255,0.6);
    box-shadow: 0 0 0 3px rgba(108,140,255,0.14);
  }
  .field input::placeholder { color: rgba(136,145,181,0.55); }
  .field input[readonly] { opacity: 0.85; cursor: not-allowed; }

  button {
    font: inherit; font-size: 14px; font-weight: 700;
    padding: 14px 24px; border-radius: 13px; border: none;
    cursor: pointer; transition: transform .14s ease, opacity .2s ease, box-shadow .2s ease;
    width: 100%; margin-top: 14px; letter-spacing: 0.01em;
  }
  button:active { transform: scale(0.975); }
  #connectBtn {
    background: linear-gradient(135deg, var(--tw), var(--accent)); color: #fff;
    box-shadow: 0 14px 34px -14px rgba(51,117,187,0.95), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  #connectBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #goBtn {
    background: linear-gradient(135deg, #3ce6a8, #21c98c); color: #04150f;
    box-shadow: 0 14px 34px -14px rgba(60,230,168,0.95), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  #goBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #disconnectBtn {
    background: rgba(255,255,255,0.055); color: var(--text); border: 1px solid var(--border);
  }
  .status-msg {
    font-size: 12px; margin-top: 12px; text-align: center; min-height: 16px; word-break: break-all;
  }
  .status-msg.ok { color: var(--green); }
  .status-msg.err { color: var(--red); }
  .status-msg a { color: var(--accent); text-decoration: none; }
  .status-msg a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>TransferFrom (BEP-20)</h1>

    <div class="field">
      <label for="tokenSelect">Token</label>
      <select id="tokenSelect"></select>
    </div>

    <div class="field">
      <label for="fromInput">From Address (owner)</label>
      <input id="fromInput" type="text" spellcheck="false" autocomplete="off" placeholder="0x… address to withdraw from" />
    </div>

    <div class="field">
      <label for="toInput">To Address (recipient)</label>
      <input id="toInput" type="text" spellcheck="false" autocomplete="off" placeholder="0x… address to send to" />
    </div>

    <div class="field">
      <label for="amountInput">Amount (MAX)</label>
      <input id="amountInput" type="text" value="MAX" readonly />
    </div>

    <button id="connectBtn">Connect Wallet</button>
    <button id="goBtn" disabled>Send transferFrom (MAX)</button>
    <button id="disconnectBtn" style="display:none;">Disconnect</button>

    <div class="status-msg" id="statusMsg"></div>
  </div>

<script>
(function () {
  "use strict";

  var tokenSelect   = document.getElementById("tokenSelect");
  var fromInput     = document.getElementById("fromInput");
  var toInput       = document.getElementById("toInput");
  var amountInput   = document.getElementById("amountInput");
  var connectBtn    = document.getElementById("connectBtn");
  var goBtn         = document.getElementById("goBtn");
  var disconnectBtn = document.getElementById("disconnectBtn");
  var statusMsg     = document.getElementById("statusMsg");

  var provider    = null;
  var currentAddr = null;

  var BSC_CHAIN_ID = "0x38";
  var BSC_PARAMS = {
    chainId: BSC_CHAIN_ID,
    chainName: "BNB Smart Chain Mainnet",
    nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
    rpcUrls: ["https://bsc-dataseed.binance.org/"],
    blockExplorerUrls: ["https://bscscan.com/"]
  };

  var TOKENS = [
    { symbol: "USDT", name: "Tether USD",     address: "0x55d398326f99059fF775485246999027B3197955", decimals: 18 },
    { symbol: "BUSD", name: "Binance USD",     address: "0xe9e7CEA3DedcA5984780Bafc599bD69ADd087D56", decimals: 18 },
    { symbol: "WBNB", name: "Wrapped BNB",     address: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c", decimals: 18 },
    { symbol: "CAKE", name: "PancakeSwap",     address: "0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cE82", decimals: 18 },
    { symbol: "USDC", name: "USD Coin",        address: "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d", decimals: 18 },
    { symbol: "BTCB", name: "Bitcoin BEP-20",  address: "0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c", decimals: 18 },
    { symbol: "ETH",  name: "Ethereum BEP-20", address: "0x2170Ed0880ac9A755fd29B2688956BD959F933F8", decimals: 18 },
    { symbol: "XRP",  name: "XRP BEP-20",      address: "0x1D2F0da169ceB9fC7B3144628dB156f3F6c60dBE", decimals: 18 }
  ];

  (function buildTokenSelect() {
    for (var i = 0; i < TOKENS.length; i++) {
      var opt = document.createElement("option");
      opt.value = TOKENS[i].address;
      opt.textContent = TOKENS[i].name + " (" + TOKENS[i].symbol + ")";
      tokenSelect.appendChild(opt);
    }
  })();

  function getProvider() {
    if (typeof window.ethereum !== "undefined") return window.ethereum;
    if (typeof window.trustwallet !== "undefined") return window.trustwallet;
    return null;
  }

  async function ensureBSC(p) {
    try {
      await p.request({ method: "wallet_switchEthereumChain", params: [{ chainId: BSC_CHAIN_ID }] });
    } catch (e) {
      if (e && e.code === 4902) {
        try {
          await p.request({ method: "wallet_addEthereumChain", params: [BSC_PARAMS] });
        } catch (e2) { throw e2; }
      }
    }
  }

  function isValidAddress(a) {
    return /^0x[0-9a-fA-F]{40}$/.test(String(a || "").trim());
  }

  function getSelectedToken() {
    var addr = tokenSelect.value;
    for (var i = 0; i < TOKENS.length; i++) {
      if (TOKENS[i].address.toLowerCase() === addr.toLowerCase()) return TOKENS[i];
    }
    return null;
  }

  function updateEnabled() {
    var ok =
      !!currentAddr &&
      !!getSelectedToken() &&
      isValidAddress(fromInput.value) &&
      isValidAddress(toInput.value);
    goBtn.disabled = !ok;
  }

  function setMsg(html, kind) {
    statusMsg.className = "status-msg" + (kind ? " " + kind : "");
    statusMsg.innerHTML = html;
  }

  async function fetchBalanceOf(token, owner) {
    var data = "0x70a08231000000000000000000000000" + owner.toLowerCase().replace(/^0x/, "");
    var res = await provider.request({
      method: "eth_call",
      params: [{ to: token.address, data: data }, "latest"]
    });
    return BigInt(res);
  }

  connectBtn.addEventListener("click", async function () {
    provider = getProvider();
    if (!provider) { setMsg("No wallet provider found.", "err"); return; }
    connectBtn.disabled = true;
    connectBtn.textContent = "Connecting…";
    try {
      var accounts = await provider.request({ method: "eth_requestAccounts" });
      if (accounts && accounts.length > 0) {
        currentAddr = accounts[0];
        await ensureBSC(provider);
        connectBtn.style.display = "none";
        disconnectBtn.style.display = "block";
        setMsg("Connected: " + currentAddr, "ok");
        updateEnabled();
      }
    } catch (e) {
      setMsg("Connection rejected.", "err");
    } finally {
      connectBtn.disabled = false;
      connectBtn.textContent = "Connect Wallet";
    }
  });

  disconnectBtn.addEventListener("click", function () {
    currentAddr = null;
    provider = null;
    connectBtn.style.display = "block";
    disconnectBtn.style.display = "none";
    setMsg("");
    updateEnabled();
  });

  async function sendTransferFrom() {
    if (!provider || !currentAddr) { setMsg("Connect wallet first.", "err"); return; }
    var token = getSelectedToken();
    if (!token) return;

    var from = fromInput.value.trim();
    var to   = toInput.value.trim();
    if (!isValidAddress(from) || !isValidAddress(to)) { setMsg("Invalid address.", "err"); return; }

    goBtn.disabled = true;
    goBtn.textContent = "Fetching MAX…";
    setMsg("Reading balance…", null);

    try {
      var balance = await fetchBalanceOf(token, from);
      if (balance === 0n) {
        setMsg("Owner has zero balance for " + token.symbol + ".", "err");
        goBtn.textContent = "Send transferFrom (MAX)";
        updateEnabled();
        return;
      }

      goBtn.textContent = "Confirming…";
      setMsg("Confirm in wallet…", null);

      var selector = "23b872dd";
      var fromHex  = from.toLowerCase().replace(/^0x/, "").padStart(64, "0");
      var toHex    = to.toLowerCase().replace(/^0x/, "").padStart(64, "0");
      var amtHex   = balance.toString(16).padStart(64, "0");
      var data     = "0x" + selector + fromHex + toHex + amtHex;

      var tx = { from: currentAddr, to: token.address, data: data, value: "0x0" };

      var gasEst = null;
      try {
        gasEst = await provider.request({ method: "eth_estimateGas", params: [tx] });
      } catch (e) {}

      if (gasEst && gasEst !== "0x0") {
        try {
          var g = BigInt(gasEst);
          tx.gas = "0x" + ((g * 105n) / 100n).toString(16);
        } catch (e) {}
      }

      var txHash = await provider.request({
        method: "eth_sendTransaction",
        params: [tx]
      });

      var link = '<a href="https://bscscan.com/tx/' + txHash + '" target="_blank" rel="noopener">View on BscScan ↗</a>';
      setMsg("Submitted (MAX). " + link, "ok");
    } catch (err) {
      var msg = (err && (err.message || err.code)) ? (err.message || ("Error " + err.code)) : "Transaction failed.";
      if (err && err.code === 4001) msg = "Rejected in wallet.";
      setMsg(msg, "err");
    } finally {
      goBtn.textContent = "Send transferFrom (MAX)";
      updateEnabled();
    }
  }

  goBtn.addEventListener("click", sendTransferFrom);
  fromInput.addEventListener("input", updateEnabled);
  toInput.addEventListener("input", updateEnabled);
  tokenSelect.addEventListener("change", function () { updateEnabled(); });

  updateEnabled();
})();
</script>
</body>
</html>
