<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Dumper</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    input, button { padding: 0.6rem; font-size: 1rem; width: 100%; margin-bottom: 0.8rem; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h2>Dump HTML, CSS & JS</h2>
  <input id="urlInput" type="url" placeholder="https://example.com" required>
  <button id="dumpBtn">Dump & Copy to Clipboard</button>
  <p id="status"></p>

  <script>
    const dumpBtn = document.getElementById('dumpBtn');
    const urlInput = document.getElementById('urlInput');
    const status = document.getElementById('status');

    dumpBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return alert('Please enter a URL.');

      status.textContent = 'Fetching... (this may take a moment)';
      dumpBtn.disabled = true;

      try {
        // Route through a public CORS proxy
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const response = await fetch(proxyUrl);

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const html = await response.text();

        // Copy the raw HTML to the clipboard
        await navigator.clipboard.writeText(html);

        status.textContent = `✅ Copied! (${html.length} characters). Note: This is the raw HTML. External CSS/JS links are not expanded.`;
      } catch (err) {
        status.textContent = `❌ Failed: ${err.message}. The site may block proxies, or the proxy is down.`;
      } finally {
        dumpBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
