<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Dumper (JS + CSS + HTML)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
    input { width: 100%; padding: .6rem; font-size: 1rem; margin-bottom: .6rem; box-sizing: border-box; }
    button { padding: .5rem .9rem; font-size: .95rem; cursor: pointer; margin-right: .4rem; margin-bottom: .4rem; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .tabs { display: flex; gap: .3rem; margin: 1rem 0 .5rem; flex-wrap: wrap; }
    .tabs button { background: #eee; border: 1px solid #ccc; border-radius: 4px; }
    .tabs button.active { background: #2563eb; color: white; border-color: #2563eb; }
    .panel { display: none; }
    .panel.active { display: block; }
    textarea { width: 100%; height: 420px; font-family: ui-monospace, monospace; font-size: .8rem; box-sizing: border-box; }
    #log { background: #0f172a; color: #a3e635; font-family: monospace; font-size: .75rem;
           padding: .7rem; height: 130px; overflow-y: auto; border-radius: 4px; white-space: pre-wrap; }
    .bar { display: flex; gap: .5rem; align-items: center; margin-bottom: .4rem; }
    .bar .info { color: #666; font-size: .85rem; flex: 1; }
  </style>
</head>
<body>
  <h2>Website Dumper — HTML + CSS + JS</h2>
  <input id="urlInput" type="url" placeholder="https://example.com">
  <button id="dumpBtn">🕵️ Dump Everything</button>
  <button id="copyJsBtn" disabled>📋 Copy JS only</button>
  <button id="downloadBtn" disabled>💾 Download all</button>

  <div class="tabs">
    <button data-tab="js" class="active">JavaScript</button>
    <button data-tab="css">CSS</button>
    <button data-tab="html">HTML</button>
    <button data-tab="log">Log</button>
  </div>

  <div class="panel active" id="panel-js">
    <div class="bar"><span class="info" id="jsInfo">—</span><button class="copy" data-target="js">📋 Copy</button></div>
    <textarea id="jsOut" placeholder="JS will appear here..."></textarea>
  </div>
  <div class="panel" id="panel-css">
    <div class="bar"><span class="info" id="cssInfo">—</span><button class="copy" data-target="css">📋 Copy</button></div>
    <textarea id="cssOut"></textarea>
  </div>
  <div class="panel" id="panel-html">
    <div class="bar"><span class="info" id="htmlInfo">—</span><button class="copy" data-target="html">📋 Copy</button></div>
    <textarea id="htmlOut"></textarea>
  </div>
  <div class="panel" id="panel-log">
    <div id="log"></div>
  </div>

<script>
const PROXY = 'https://api.allorigins.win/raw?url=';
const MAX_SCRIPTS = 100;
const MAX_TOTAL_CHARS = 20_000_000;

const $ = id => document.getElementById(id);
const log = msg => { const el = $('log'); el.textContent += msg + '\n'; el.scrollTop = el.scrollHeight; };

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(2) + ' MB';
}

async function fetchViaProxy(url) {
  const r = await fetch(PROXY + encodeURIComponent(url));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}

// simple concurrency pool
async function pool(items, limit, worker) {
  let i = 0;
  const run = async () => {
    while (i < items.length) {
      const idx = i++;
      await worker(items[idx], idx);
    }
  };
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, run));
}

// tab switching
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $('panel-' + btn.dataset.tab).classList.add('active');
  };
});

// copy buttons (each click = fresh user activation ✅)
document.querySelectorAll('.copy').forEach(btn => {
  btn.onclick = async () => {
    const ta = $({js:'jsOut', css:'cssOut', html:'htmlOut'}[btn.dataset.target]);
    try {
      await navigator.clipboard.writeText(ta.value);
      btn.textContent = '✅ Copied!';
    } catch {
      ta.select(); document.execCommand('copy'); btn.textContent = '✅ Copied (legacy)';
    }
    setTimeout(() => btn.textContent = '📋 Copy', 1200);
  };
});

$('copyJsBtn').onclick = () => {
  $('jsOut').select();
  navigator.clipboard.writeText($('jsOut').value).then(
    () => { $('copyJsBtn').textContent = '✅ JS Copied!'; setTimeout(()=>$('copyJsBtn').textContent='📋 Copy JS only', 1500); },
    () => { document.execCommand('copy'); }
  );
};

$('downloadBtn').onclick = () => {
  const blob = new Blob([
    '/* ====================== JS ====================== */\n' + $('jsOut').value +
    '\n\n/* ====================== CSS ====================== */\n' + $('cssOut').value +
    '\n\n<!-- ====================== HTML ====================== -->\n' + $('htmlOut').value
  ], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dump.txt';
  a.click();
  URL.revokeObjectURL(a.href);
};

$('dumpBtn').onclick = async () => {
  const url = $('urlInput').value.trim();
  if (!url) return alert('Enter a URL');
  $('log').textContent = '';
  $('dumpBtn').disabled = true;
  $('copyJsBtn').disabled = true;
  $('downloadBtn').disabled = true;
  $('jsOut').value = $('cssOut').value = $('htmlOut').value = '';

  try {
    // 1. fetch HTML
    log('▶ Fetching HTML: ' + url);
    const html = await fetchViaProxy(url);
    $('htmlOut').value = html;
    $('htmlInfo').textContent = fmtSize(html.length) + ' · ' + html.length + ' chars';
    log('✓ HTML: ' + fmtSize(html.length));

    // 2. parse
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const baseEl = doc.querySelector('base[href]');
    const baseUrl = baseEl ? new URL(baseEl.getAttribute('href'), url).href : url;

    // 3. collect scripts
    const scripts = [];
    let inlineScriptN = 0;
    doc.querySelectorAll('script').forEach(s => {
      const type = s.getAttribute('type') || 'text/javascript';
      if (s.src) {
        try { scripts.push({ kind: 'external', src: new URL(s.getAttribute('src'), baseUrl).href, type }); }
        catch (e) { log('  ! bad script src: ' + s.getAttribute('src')); }
      } else if (s.textContent.trim()) {
        inlineScriptN++;
        scripts.push({ kind: 'inline', n: inlineScriptN, code: s.textContent, type });
      }
    });

    const extScripts = scripts.filter(s => s.kind === 'external').slice(0, MAX_SCRIPTS);
    log(`✓ Found ${extScripts.length} external scripts + ${inlineScriptN} inline scripts`);

    // 4. fetch external scripts
    let totalChars = 0;
    await pool(extScripts, 4, async (item, i) => {
      try {
        const code = await fetchViaProxy(item.src);
        totalChars += code.length;
        if (totalChars > MAX_TOTAL_CHARS) { item.error = 'size cap reached, skipped'; log(`  ⏭ [${i+1}/${extScripts.length}] skipped (${fmtSize(code.length)} too big cumulatively)`); return; }
        item.code = code;
        log(`  ✓ [${i+1}/${extScripts.length}] ${fmtSize(code.length)}  ${item.src}`);
      } catch (e) {
        item.error = e.message;
        log(`  ✗ [${i+1}/${extScripts.length}] ${item.src}  (${e.message})`);
      }
    });

    // 5. collect CSS
    const cssItems = [];
    let inlineCssN = 0;
    doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach(l => {
      try { cssItems.push({ kind: 'external', src: new URL(l.getAttribute('href'), baseUrl).href, media: l.getAttribute('media') }); }
      catch (e) {}
    });
    doc.querySelectorAll('style').forEach(s => {
      inlineCssN++;
      cssItems.push({ kind: 'inline', n: inlineCssN, code: s.textContent });
    });
    const extCss = cssItems.filter(c => c.kind === 'external').slice(0, MAX_SCRIPTS);
    log(`✓ Found ${extCss.length} external stylesheets + ${inlineCssN} inline <style> blocks`);

    // 6. fetch external CSS
    await pool(extCss, 4, async (item, i) => {
      try {
        const code = await fetchViaProxy(item.src);
        item.code = code;
        log(`  ✓ [${i+1}/${extCss.length}] ${fmtSize(code.length)}  ${item.src}`);
      } catch (e) {
        item.error = e.message;
        log(`  ✗ [${i+1}/${extCss.length}] ${item.src}  (${e.message})`);
      }
    });

    // 7. assemble JS output
    const jsParts = [];
    for (const s of scripts) {
      if (s.kind === 'inline') {
        jsParts.push(`\n/* ===== INLINE <script> #${s.n} (type="${s.type}") ===== */\n${s.code.trim()}\n`);
      } else {
        jsParts.push(`\n/* ===== EXTERNAL: ${s.src} (type="${s.type}") ===== */`);
        jsParts.push(s.error ? `/* ❌ FAILED TO FETCH: ${s.error} */\n` : (s.code || '/* (not fetched) */') + '\n');
      }
    }
    const jsText = jsParts.join('\n');
    $('jsOut').value = jsText;
    $('jsInfo').textContent = fmtSize(jsText.length) + ' · ' + jsText.length + ' chars';

    // 8. assemble CSS output
    const cssParts = [];
    for (const c of cssItems) {
      if (c.kind === 'inline') {
        cssParts.push(`\n/* ===== INLINE <style> #${c.n} ===== */\n${c.code.trim()}\n`);
      } else {
        cssParts.push(`\n/* ===== EXTERNAL: ${c.src}${c.media ? ' media="'+c.media+'"' : ''} ===== */`);
        cssParts.push(c.error ? `/* ❌ FAILED TO FETCH: ${c.error} */\n` : (c.code || '') + '\n');
      }
    }
    const cssText = cssParts.join('\n');
    $('cssOut').value = cssText;
    $('cssInfo').textContent = fmtSize(cssText.length) + ' · ' + cssText.length + ' chars';

    log('\n✅ DONE. Switch tabs to see JS / CSS / HTML. Click "Copy JS only" to grab the JS.');

    // jump to JS tab automatically since that's what you care about
    document.querySelector('.tabs button[data-tab="js"]').click();

    $('copyJsBtn').disabled = false;
    $('downloadBtn').disabled = false;
  } catch (err) {
    log('❌ FATAL: ' + err.message);
  } finally {
    $('dumpBtn').disabled = false;
  }
};
</script>
</body>
</html>
