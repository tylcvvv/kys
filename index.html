<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website Dumper v3</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 1rem auto; padding: 0 1rem 2rem; background:#f9fafb; color:#111; }
  .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .6rem; }
  input[type=url] { flex:1; min-width:220px; padding:.55rem .7rem; font-size:1rem; border:1px solid #ccc; border-radius:6px; }
  button { padding:.55rem .9rem; font-size:.92rem; cursor:pointer; border:1px solid #d1d5db; background:#fff; border-radius:6px; font-weight:500; }
  button:hover:not(:disabled){ background:#f3f4f6; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  button.primary { background:#2563eb; color:#fff; border-color:#2563eb; }
  button.primary:hover:not(:disabled){ background:#1d4ed8; }
  .status-row { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.5rem; }
  .status { padding:.3rem .65rem; border-radius:4px; font-size:.78rem; font-family:monospace; background:#e5e7eb; color:#374151; }
  .status.ok{ background:#dcfce7; color:#166534; } .status.err{ background:#fee2e2; color:#991b1b; } .status.busy{ background:#dbeafe; color:#1e40af; }
  .log { background:#0a0a0a; color:#d4d4d4; font-family:ui-monospace,monospace; font-size:12px; line-height:1.45; padding:.6rem; height:280px; overflow-y:auto; border-radius:6px; margin:0 0 1rem; border:1px solid #1f2937; }
  .log > div { white-space:pre-wrap; word-break:break-all; }
  .log .ok{ color:#4ade80; } .log .err{ color:#f87171; } .log .warn{ color:#fbbf24; } .log .info{ color:#93c5fd; } .log .dim{ color:#9ca3af; } .log .ts{ color:#4b5563; margin-right:.5rem; }
  .tabs { display:flex; gap:.25rem; margin-bottom:.4rem; flex-wrap:wrap; }
  .tab { padding:.4rem .8rem; background:#e5e7eb; border:1px solid #d1d5db; border-bottom:none; border-radius:6px 6px 0 0; cursor:pointer; font-size:.85rem; }
  .tab.active{ background:#fff; border-bottom-color:#fff; font-weight:600; }
  .panel{ display:none; } .panel.active{ display:block; }
  .panel-head{ display:flex; align-items:center; gap:.5rem; margin-bottom:.3rem; }
  .panel-head .info{ font-size:.8rem; color:#6b7280; font-family:monospace; flex:1; }
  textarea{ width:100%; height:420px; font-family:ui-monospace,monospace; font-size:11px; padding:.5rem; border:1px solid #d1d5db; border-radius:0 6px 6px 6px; resize:vertical; background:#fff; }
</style>
</head>
<body>

<div class="toolbar">
  <input id="urlInput" type="url" placeholder="https://example.com" autocomplete="off">
  <button id="dumpBtn" class="primary">🕵️ Dump</button>
  <button id="testBtn">🧪 Test Proxies</button>
</div>

<div class="status-row">
  <span class="status" id="statusProxy">proxy: —</span>
  <span class="status" id="statusPhase">phase: idle</span>
  <span class="status" id="statusCount">requests: 0</span>
</div>

<div class="log" id="log"></div>

<div class="tabs">
  <button class="tab active" data-tab="js">JavaScript</button>
  <button class="tab" data-tab="css">CSS</button>
  <button class="tab" data-tab="html">HTML</button>
</div>
<div class="panel active" id="panel-js">
  <div class="panel-head"><span class="info" id="jsInfo">—</span><button class="copy" data-target="jsOut">📋 Copy JS</button></div>
  <textarea id="jsOut" placeholder="JS here…"></textarea>
</div>
<div class="panel" id="panel-css">
  <div class="panel-head"><span class="info" id="cssInfo">—</span><button class="copy" data-target="cssOut">📋 Copy CSS</button></div>
  <textarea id="cssOut"></textarea>
</div>
<div class="panel" id="panel-html">
  <div class="panel-head"><span class="info" id="htmlInfo">—</span><button class="copy" data-target="htmlOut">📋 Copy HTML</button></div>
  <textarea id="htmlOut"></textarea>
</div>

<script>
const PROXIES = [
  { name:'allorigins', build:u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u) },
  { name:'codetabs',   build:u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u) },
  { name:'corsproxy',  build:u=>'https://corsproxy.io/?url='+encodeURIComponent(u) },
  { name:'thingproxy', build:u=>'https://thingproxy.freeboard.io/fetch/'+u },
];
let preferredProxyIdx = 0, requestCount = 0;
const $ = id => document.getElementById(id);

const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(msg, cls='dim') {
  const el = $('log');
  const line = document.createElement('div');
  line.className = cls;
  line.innerHTML = `<span class="ts">${new Date().toLocaleTimeString()}</span>${escapeHtml(msg)}`;
  el.appendChild(line);
  if (el.children.length > 800) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
  (cls==='err'?console.error:cls==='warn'?console.warn:console.log)('[dumper]', msg);
}
function setStatus(id, text, cls) { const e=$(id); e.textContent=text; e.className='status'+(cls?' '+cls:''); }
function fmtSize(n){ return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'; }

async function fetchViaProxy(url, { timeout=20000, what='' } = {}) {
  requestCount++; setStatus('statusCount','requests: '+requestCount);
  const order = [];
  for (let i=0;i<PROXIES.length;i++) order.push(PROXIES[(preferredProxyIdx+i)%PROXIES.length]);
  const errors = [];
  for (const proxy of order) {
    log(`  → ${what||''} via ${proxy.name}`, 'dim');
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), timeout);
    try {
      const res = await fetch(proxy.build(url), { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      preferredProxyIdx = PROXIES.indexOf(proxy);
      setStatus('statusProxy','proxy: '+proxy.name,'ok');
      log(`  ✓ ${proxy.name} → ${fmtSize(text.length)}`, 'ok');
      return text;
    } catch (err) {
      clearTimeout(timer);
      const msg = err.name==='AbortError'?`timeout ${timeout/1000}s`:err.message||String(err);
      log(`  ✗ ${proxy.name}: ${msg}`, 'err');
      errors.push(proxy.name+': '+msg);
    }
  }
  setStatus('statusProxy','proxy: ALL FAILED','err');
  throw new Error('All proxies failed → '+errors.join(' | '));
}

async function pool(items, limit, worker, onProgress) {
  const total = items.length, results = new Array(total);
  let nextIdx=0, completed=0;
  async function run() {
    while (true) {
      const idx = nextIdx++;
      if (idx >= total) return;
      let r;
      try { r = await worker(items[idx], idx); }
      catch (e) { r = { error: e.message || String(e) }; }
      results[idx] = r; completed++;
      if (onProgress) { try { onProgress(completed,total,items[idx],r); } catch(e){ console.error(e); } }
    }
  }
  await Promise.all(Array.from({length:Math.min(limit,total)}, ()=>run()));
  return results;
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); $('panel-'+t.dataset.tab).classList.add('active');
}));

async function copyText(text, btn) {
  const original = btn.textContent;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else throw new Error('no clipboard API');
    btn.textContent = '✅ Copied!';
  } catch (e) {
    try {
      const tmp = document.createElement('textarea');
      tmp.value = text; tmp.style.position='fixed'; tmp.style.left='-9999px';
      document.body.appendChild(tmp); tmp.focus(); tmp.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(tmp);
      if (!ok) throw new Error('execCommand returned false');
      btn.textContent = '✅ Copied (legacy)';
    } catch (e2) {
      btn.textContent = '❌ Copy failed';
      log('❌ Clipboard blocked. Select the textarea text and press Ctrl+C. Error: '+e2.message, 'err');
    }
  }
  setTimeout(()=>{ btn.textContent = original; }, 1600);
}
document.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', () => {
  const ta = $(btn.dataset.target);
  if (!ta.value) { log('Nothing to copy — run a dump first.', 'warn'); return; }
  copyText(ta.value, btn);
}));

$('testBtn').addEventListener('click', async () => {
  log('══════ Testing proxies against https://example.com ══════', 'info');
  let anyOk = false;
  for (const proxy of PROXIES) {
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 10000);
    try {
      const res = await fetch(proxy.build('https://example.com'), { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      if (/Example Domain/i.test(text)) { log(`✅ ${proxy.name}: OK (${fmtSize(text.length)})`, 'ok'); anyOk = true; }
      else log(`⚠️ ${proxy.name}: ${fmtSize(text.length)} but content doesn't look right`, 'warn');
    } catch (e) {
      clearTimeout(timer);
      log(`❌ ${proxy.name}: ${e.name==='AbortError'?'timeout':e.message}`, 'err');
    }
  }
  log(anyOk ? '✅ At least one proxy works — dumping should work.' : '❌ No proxies worked. Your network may block them all, or they are all down. Try the Node backend version instead.', anyOk?'ok':'err');
});

$('dumpBtn').addEventListener('click', async () => {
  let url = $('urlInput').value.trim();
  if (!url) { log('❌ Enter a URL first.', 'err'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  $('urlInput').value = url;

  $('dumpBtn').disabled = true;
  $('jsOut').value = $('cssOut').value = $('htmlOut').value = '';
  $('jsInfo').textContent = $('cssInfo').textContent = $('htmlInfo').textContent = '—';
  $('log').innerHTML = '';
  requestCount = 0; setStatus('statusCount','requests: 0');
  setStatus('statusPhase','phase: starting','busy');
  log('══════════════════════════════════════════════', 'info');
  log('🚀 Dumping: ' + url, 'info');
  log('══════════════════════════════════════════════', 'info');

  try {
    setStatus('statusPhase','phase: fetching HTML','busy');
    log('📄 Step 1: Fetching HTML…', 'info');
    const html = await fetchViaProxy(url, { what:'HTML' });
    $('htmlOut').value = html;
    $('htmlInfo').textContent = fmtSize(html.length);
    if (/cf-chl|Just a moment|Attention Required|Enable JavaScript and cookies/i.test(html.slice(0,3000))) {
      log('⚠️ Response looks like a Cloudflare/anti-bot page. Site is probably blocking the proxy.', 'warn');
    }

    setStatus('statusPhase','phase: parsing DOM','busy');
    log('🔍 Step 2: Parsing DOM…', 'info');
    const doc = new DOMParser().parseFromString(html, 'text/html');
    let baseUrl = url;
    const baseEl = doc.querySelector('base[href]');
    if (baseEl) { try { baseUrl = new URL(baseEl.getAttribute('href'), url).href; log('  base: '+baseUrl,'dim'); } catch(e){} }

    const allScripts = [...doc.querySelectorAll('script')];
    log(`📜 Found ${allScripts.length} <script> element(s)`, 'info');
    const scriptPlan = []; let inlineN=0, extN=0;
    for (const s of allScripts) {
      const type = s.getAttribute('type') || 'text/javascript';
      const srcRaw = s.getAttribute('src');
      if (srcRaw) {
        try { scriptPlan.push({ kind:'external', src: new URL(srcRaw, baseUrl).href, type, extIdx: extN++ }); }
        catch(e) { log(`  ⚠️ bad src: ${srcRaw}`, 'warn'); }
      } else if (s.textContent.trim()) {
        scriptPlan.push({ kind:'inline', code:s.textContent, type, inlineIdx: ++inlineN });
      }
    }
    log(`  → ${extN} external, ${inlineN} inline`, 'info');

    const externalScripts = scriptPlan.filter(p=>p.kind==='external');
    let scriptResults = [];
    if (externalScripts.length) {
      setStatus('statusPhase',`phase: fetching JS (${externalScripts.length})`,'busy');
      log(`⬇️ Step 3: Fetching ${externalScripts.length} JS file(s)…`, 'info');
      scriptResults = await pool(
        externalScripts, 4,
        item => fetchViaProxy(item.src, { what:'JS' }),
        (n,total,item,r) => {
          if (r && typeof r==='string') log(`  ✅ [${n}/${total}] ${fmtSize(r.length)} — ${item.src}`, 'ok');
          else log(`  ❌ [${n}/${total}] FAILED — ${item.src}`, 'err');
        }
      );
    }

    const jsParts = [];
    for (const p of scriptPlan) {
      if (p.kind === 'inline') {
        const hdr = `/* ===== INLINE <script> #${p.inlineIdx}${p.type !== 'text/javascript' ? ` (type="${p.type}")` : ''} ===== */`;
        jsParts.push(hdr + '\n' + p.code.trim() + '\n');
      } else {
        const hdr = `/* ===== EXTERNAL: ${p.src} ===== */`;
        const r = scriptResults[p.extIdx];
        if (r && typeof r === 'string') jsParts.push(hdr + '\n' + r + '\n');
        else jsParts.push(hdr + '\n/* ❌ FAILED: ' + ((r && r.error) || 'unknown') + ' */\n');
      }
    }
    const jsText = jsParts.join('\n');
    $('jsOut').value = jsText;
    $('jsInfo').textContent = fmtSize(jsText.length);

    setStatus('statusPhase','phase: fetching CSS','busy');
    log('🎨 Step 4: Collecting CSS…', 'info');
    const cssPlan = []; let inlineCssN = 0;
    doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach(l => {
      try { cssPlan.push({ kind:'external', src:new URL(l.getAttribute('href'), baseUrl).href, media: l.getAttribute('media') }); }
      catch(e){ log(`  ⚠️ bad href: ${l.getAttribute('href')}`, 'warn'); }
    });
    doc.querySelectorAll('style').forEach(s => {
      if (s.textContent.trim()) cssPlan.push({ kind:'inline', code:s.textContent, n: ++inlineCssN });
    });
    const externalCss = cssPlan.filter(p=>p.kind==='external');
    log(`  → ${externalCss.length} external stylesheet(s), ${inlineCssN} inline <style>`, 'info');

    let cssResults = [];
    if (externalCss.length) {
      log(`⬇️ Fetching ${externalCss.length} CSS file(s)…`, 'info');
      cssResults = await pool(
        externalCss, 4,
        item => fetchViaProxy(item.src, { what:'CSS' }),
        (n,total,item,r) => {
          if (r && typeof r==='string') log(`  ✅ [${n}/${total}] ${fmtSize(r.length)} — ${item.src}`, 'ok');
          else log(`  ❌ [${n}/${total}] FAILED — ${item.src}`, 'err');
        }
      );
    }

    const cssParts = []; let extCssIdx = 0;
    for (const p of cssPlan) {
      if (p.kind === 'inline') {
        cssParts.push(`/* ===== INLINE <style> #${p.n} ===== */\n${p.code.trim()}\n`);
      } else {
        const hdr = `/* ===== EXTERNAL: ${p.src}${p.media ? ` (media="${p.media}")` : ''} ===== */`;
        const r = cssResults[extCssIdx++];
        if (r && typeof r === 'string') cssParts.push(hdr + '\n' + r + '\n');
        else cssParts.push(hdr + '\n/* ❌ FAILED: ' + ((r && r.error) || 'unknown') + ' */\n');
      }
    }
    const cssText = cssParts.join('\n');
    $('cssOut').value = cssText;
    $('cssInfo').textContent = fmtSize(cssText.length);

    document.querySelector('.tab[data-tab="js"]').click();
    const failCount = scriptResults.filter(r => !r || typeof r !== 'string').length;
    setStatus('statusPhase', 'phase: done', failCount ? 'warn' : 'ok');
    log('══════════════════════════════════════════════', 'ok');
    log(`✅ DONE. HTML ${fmtSize(html.length)} · CSS ${fmtSize(cssText.length)} · JS ${fmtSize(jsText.length)}`, 'ok');
    if (failCount) log(`⚠️ ${failCount} external script(s) failed — see the ❌ lines above.`, 'warn');
    log('Click "📋 Copy JS" on the JavaScript tab.', 'info');
  } catch (err) {
    log('❌ FATAL: ' + (err.message || String(err)), 'err');
    console.error('[dumper] fatal:', err);
    setStatus('statusPhase', 'phase: error', 'err');
  } finally {
    $('dumpBtn').disabled = false;
  }
});

log('Ready. Enter a URL and click Dump. Open DevTools (F12) to see the console log too.', 'info');
if (!window.isSecureContext) log('⚠️ Not a secure context (file:// or http://) — clipboard will use legacy fallback.', 'warn');
</script>
</body>
</html>
