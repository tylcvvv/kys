<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Dumper</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; }
    input, button { padding: 0.6rem; font-size: 1rem; margin-bottom: 0.8rem; }
    input { width: 100%; }
    button { cursor: pointer; }
    textarea { width: 100%; height: 300px; font-family: monospace; font-size: 0.85rem; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h2>Dump HTML, CSS & JS</h2>
  <input id="urlInput" type="url" placeholder="https://example.com" required>
  <div class="row">
    <button id="dumpBtn">Dump</button>
    <button id="copyBtn" disabled>📋 Copy to Clipboard</button>
    <button id="downloadBtn" disabled>💾 Download .html</button>
  </div>
  <p id="status"></p>
  <textarea id="output" placeholder="Fetched HTML will appear here..."></textarea>

  <script>
    const dumpBtn = document.getElementById('dumpBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const urlInput = document.getElementById('urlInput');
    const status = document.getElementById('status');
    const output = document.getElementById('output');

    // Step 1: fetch (can be slow, that's fine)
    dumpBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return alert('Please enter a URL.');

      status.textContent = 'Fetching... (this may take a moment)';
      dumpBtn.disabled = true;
      copyBtn.disabled = true;
      downloadBtn.disabled = true;

      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error(`Proxy returned HTTP ${response.status}`);

        const html = await response.text();
        output.value = html;
        status.textContent = `✅ Fetched ${html.length} characters. Click "Copy" now.`;
        copyBtn.disabled = false;
        downloadBtn.disabled = false;
      } catch (err) {
        // ONLY fetch errors land here now
        status.textContent = `❌ Fetch failed: ${err.message}`;
      } finally {
        dumpBtn.disabled = false;
      }
    });

    // Step 2: copy — this is its own click, so activation is fresh
    copyBtn.addEventListener('click', async () => {
      const text = output.value;
      if (!text) return;

      // Modern API first
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = '📋 Copied to clipboard!';
        return;
      } catch (_) { /* fall through to legacy method */ }

      // Legacy fallback (works even when Clipboard API is grumpy)
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);

      status.textContent = ok
        ? '📋 Copied (legacy method)!'
        : '❌ Copy failed — select the text and press Ctrl+C.';
    });

    // Optional: download instead of copy
    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([output.value], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dumped.html';
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
